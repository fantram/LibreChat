name: Build API on ci-theme

on:
  push:
    branches:
      - ci-theme

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORT: 3080
      MONGO_URI: mongodb://127.0.0.1:27017/LibreChat

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build only the API service
        run: docker compose build api
  deploy:
    runs-on: ubuntu-latest
    env:
      PORT: 3080
      MONGO_URI: mongodb://127.0.0.1:27017/LibreChat
    needs: build
    steps:
      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GITHUBDEPLOY_HOST }}
          username: ${{ secrets.GITHUBDEPLOY_USERNAME }}
          key: ${{ secrets.GITHUBDEPLOY_SSH_KEY }}
          script: |
            cd $HOME/projects/LibreChat
            git reset --hard HEAD
            git pull origin ci-theme
            docker-compose -f ./deploy-compose.yml up -d

            cd $HOME/projects/LibreChat

            # # Stelle sicher, dass du auf dem gewünschten Branch bist
            # git checkout ci-theme

            # # Stelle sicher, dass der Branch aktuell ist
            # git fetch origin
            # git reset --hard origin/ci-theme