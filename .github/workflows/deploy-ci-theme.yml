name: Build API on ci-theme

on:
  push:
    branches:
      - ci-theme

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORT: 3080
      MONGO_URI: mongodb://127.0.0.1:27017/LibreChat

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build only the API service
        run: docker compose build api
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 85.214.241.142
          username: GITHUBDEPLOY
          key: ${{ secrets.GITHUBDEPLOY_SSH_KEY }}
          script: |
            cd $HOME/projects/LibreChat
            git pull
            docker compose build api
            docker compose up -d